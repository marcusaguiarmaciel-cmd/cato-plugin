<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161f30"/>
      <stop offset="100%" stop-color="#1a2436"/>
    </linearGradient>
    <linearGradient id="statusGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#132a2e"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace; font-size: 12.2px; fill: #e2e8f0; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .cmd { fill: #38bdf8; font-weight: 700; }
      .h1 { fill: #f8fafc; font-weight: 700; font-size: 13px; }
      .sec { fill: #eab308; font-weight: 700; }
      .dim { fill: #94a3b8; }
      .green { fill: #4ade80; font-weight: 600; }
      .amber { fill: #fbbf24; font-weight: 600; }
      .red { fill: #f87171; font-weight: 600; }
      .cyan { fill: #22d3ee; font-weight: 600; }
    </style>
  </defs>

  <!-- Outer Terminal Window -->
  <rect x="4" y="4" width="1112" height="642" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Title Bar -->
  <path d="M 4 16 Q 4 4 16 4 L 1104 4 Q 1116 4 1116 16 L 1116 42 L 4 42 Z" fill="url(#headerGrad)"/>
  <line x1="4" y1="42" x2="1116" y2="42" stroke="#1e293b" stroke-width="1"/>
  <circle cx="26" cy="23" r="6.5" fill="#ef4444"/>
  <circle cx="46" cy="23" r="6.5" fill="#f59e0b"/>
  <circle cx="66" cy="23" r="6.5" fill="#10b981"/>
  <text x="560" y="28" text-anchor="middle" class="title">Claude Code — CATO: Claude Adaptive Token Optimizer (v1.4.2)</text>

  <!-- Vertical Divider between /cato and /cato-doctor -->
  <line x1="572" y1="42" x2="572" y2="608" stroke="#1e293b" stroke-width="1.5"/>

  <!-- ================= LEFT PANEL: /cato ================= -->
  <g transform="translate(22, 66)">
    <text x="0" y="0" class="mono"><tspan class="cmd">❯ /cato</tspan></text>
    <text x="0" y="22" class="mono h1">CATO · Real cost — last 30 days</text>
    <text x="0" y="38" class="mono dim">Official price × billed tokens of each API call.</text>
    <line x1="0" y1="46" x2="528" y2="46" stroke="#334155" stroke-width="1"/>

    <!-- Cost Table -->
    <text x="0" y="64" class="mono dim" xml:space="preserve">Period        Cost    Calls     Tokens   Avg ctx   Max ctx</text>
    <text x="0" y="81" class="mono" xml:space="preserve">today       <tspan class="green">$4.80</tspan>       24      3.8M      158k      312k</text>
    <text x="0" y="97" class="mono" xml:space="preserve">7 days     <tspan class="green">$38.40</tspan>      186     29.4M      172k      465k</text>
    <text x="0" y="113" class="mono" xml:space="preserve">30 days   <tspan class="green">$142.10</tspan>      712    114.2M      164k      520k</text>
    <text x="0" y="132" class="mono dim">Subagents: $18.90 in 148 calls (13% of the total).</text>

    <!-- Cache misses -->
    <text x="0" y="158" class="mono sec">Cache misses — main conversation (rewrites &gt; 100k)</text>
    <text x="0" y="176" class="mono" xml:space="preserve">Idle longer than the cache           9×    <tspan class="amber">$16.40</tspan></text>
    <text x="0" y="192" class="mono" xml:space="preserve">Model switch                         4×     <tspan class="amber">$7.80</tspan></text>
    <text x="0" y="208" class="mono" xml:space="preserve">Other (prefix changed)               2×     <tspan class="dim">$3.10</tspan></text>
    <text x="0" y="226" class="mono dim">• Expected rebuilds after /compact (not misses): 14× · $11.20</text>

    <!-- Cost by context size -->
    <text x="0" y="252" class="mono sec">Main conversation cost by context size</text>
    <text x="0" y="270" class="mono" xml:space="preserve">&lt; 100k      $22.40   18%   │  250–400k    $39.40   32%</text>
    <text x="0" y="286" class="mono" xml:space="preserve">100–250k    $46.80   38%   │  &gt; 400k      $14.60   12%</text>

    <!-- Tokens saved -->
    <text x="0" y="314" class="mono sec">Tokens saved</text>
    <text x="0" y="332" class="mono" xml:space="preserve">Commands rewritten by RTK           94×    <tspan class="cyan">1.4M</tspan></text>
    <text x="0" y="348" class="mono" xml:space="preserve">Large MCP responses sandboxed       38×    <tspan class="cyan">820k</tspan></text>
    <text x="0" y="364" class="mono" xml:space="preserve">Command output compressed           67×    <tspan class="cyan">610k</tspan></text>
    <text x="0" y="380" class="mono" xml:space="preserve">Heavy reads denied                  19×    <tspan class="cyan">490k</tspan></text>
    <text x="0" y="396" class="mono" xml:space="preserve">Large reads replaced by outline     12×    <tspan class="cyan">240k</tspan></text>
    <text x="0" y="412" class="mono" xml:space="preserve">Old results masked (cold compact)   29×    <tspan class="cyan">180k</tspan></text>

    <rect x="0" y="424" width="528" height="44" rx="6" fill="#0f291e" stroke="#166534" stroke-width="1"/>
    <text x="10" y="443" class="mono green">Total: 3.7M fewer tokens in context ≈ $29.60 saved on entry</text>
    <text x="10" y="460" class="mono dim">Every later turn also skips re-reading them · 6 cold prompts held</text>

    <!-- Recommendations -->
    <text x="0" y="490" class="mono sec">What would save the most</text>
    <text x="0" y="508" class="mono">• After a long break, use /clear or /compact before continuing.</text>
    <text x="0" y="524" class="mono dim">Includes 418 calls imported from transcripts (Oct 1 – Oct 27).</text>
  </g>

  <!-- ================= RIGHT PANEL: /cato-doctor & Guard ================= -->
  <g transform="translate(592, 66)">
    <text x="0" y="0" class="mono"><tspan class="cmd">❯ /cato-doctor</tspan></text>
    <text x="0" y="22" class="mono h1">CATO · Diagnostics</text>
    <text x="0" y="38" class="mono dim">Read-only: nothing was changed. Language: English (auto).</text>
    <line x1="0" y1="46" x2="504" y2="46" stroke="#334155" stroke-width="1"/>

    <text x="0" y="64" class="mono sec">Conflicts &amp; Integrations</text>
    <text x="0" y="82" class="mono">✅ No leftovers from the Python version.</text>
    <text x="0" y="98" class="mono">✅ RTK installed · ✅ ast-grep installed (structural_search)</text>
    <text x="0" y="114" class="mono">✅ Graphify graph found · ✅ Serena MCP · ✅ GitHub MCP</text>
    <text x="0" y="130" class="mono">✅ Python found: .py syntax check after edits is on.</text>

    <text x="0" y="156" class="mono sec">Fixed context (sent with every call)</text>
    <text x="0" y="174" class="mono">✅ CLAUDE.md: 94 lines (under the 200-line threshold).</text>
    <text x="0" y="190" class="mono">ℹ️ Tools from MCP: 22 (18 behind ToolSearch), ≈ 2.8k tokens.</text>
    <text x="0" y="206" class="mono">ℹ️ Tools from CATO: 6, ≈ 410 tokens of descriptions.</text>

    <text x="0" y="232" class="mono sec">Cache &amp; Active Options</text>
    <text x="0" y="250" class="mono amber">⚠️ model=opusplan: entering/exiting plan mode switches</text>
    <text x="0" y="266" class="mono amber">   models and re-reads the conversation without cache.</text>
    <text x="0" y="282" class="mono">✅ Main conversation TTL: 60 min · Subagent TTL: 5 min.</text>
    <text x="0" y="298" class="mono">ℹ️ Experimental: readGuard on, maskColdCompact on, warmCache on.</text>

    <!-- Box showing Cold Cache Prompt Guard in action -->
    <rect x="0" y="322" width="504" height="118" rx="8" fill="#231c0d" stroke="#854d0e" stroke-width="1.2"/>
    <text x="12" y="344" class="mono amber">⏸ CATO held this prompt once: cache expired (74 min idle).</text>
    <text x="12" y="364" class="mono">Continuing now rewrites <tspan class="amber">340k tokens ≈ $2.72</tspan>. Options:</text>
    <text x="12" y="384" class="mono">• <tspan class="green">/clear ≈ $0.01</tspan> — start clean (best for a new task)</text>
    <text x="12" y="402" class="mono">• <tspan class="cyan">/compact ≈ $0.38</tspan> once — context drops to ~20k</text>
    <text x="12" y="422" class="mono dim">• Send the prompt again to continue anyway (never held twice).</text>

    <!-- Box showing BM25 MCP Sandbox in action -->
    <rect x="0" y="452" width="504" height="76" rx="8" fill="#0f1e2e" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="12" y="473" class="mono cyan">[CATO Sandbox #sbx_8f41c92a] 48.2k chars (~12k tokens → 1.1k)</text>
    <text x="12" y="492" class="mono">Start + end kept. Query chunks via <tspan class="cmd">mcp__cato__search_sandbox</tspan></text>
    <text x="12" y="510" class="mono dim">or repeat the exact same tool call to receive it in full.</text>
  </g>

  <!-- Bottom Status Bar -->
  <path d="M 4 608 L 1116 608 L 1116 634 Q 1116 646 1104 646 L 16 646 Q 4 646 4 634 Z" fill="url(#statusGrad)"/>
  <line x1="4" y1="608" x2="1116" y2="608" stroke="#1e293b" stroke-width="1"/>
  <text x="22" y="631" class="mono"><tspan class="cyan">● CATO</tspan>: 184k ctx · next turn ≈ <tspan class="green">$0.04</tspan> · cache expires in <tspan class="green">48 min</tspan> · session <tspan class="green">$1.42</tspan></text>
  <text x="1098" y="631" text-anchor="end" class="mono dim">mcp__cato__repo_map · read_symbol · search_sandbox</text>
</svg>
